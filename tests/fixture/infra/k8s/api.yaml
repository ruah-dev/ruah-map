apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: acme
spec:
  replicas: 3
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/acme/api:1.2.0
          env:
            - name: REDIS_URL
              value: redis://redis:6379
          envFrom:
            - secretRef:
                name: api-secrets
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: acme}
spec:
  selector: {app: api}
  ports: [{port: 80, targetPort: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: public, namespace: acme}
spec:
  rules:
    - host: api.acme.dev
      http:
        paths:
          - path: /
            backend:
              service:
                name: api
                port: {number: 80}
---
apiVersion: v1
kind: Secret
metadata: {name: api-secrets, namespace: acme}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: redis, namespace: acme}
spec:
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers: [{name: redis, image: "redis:7"}]
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: acme}
spec:
  selector: {app: redis}
  ports: [{port: 6379}]
